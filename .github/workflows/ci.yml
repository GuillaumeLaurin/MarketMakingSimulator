name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Run the pipeline even when the modules have no source files yet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  guard:
    name: Guard - detect sources
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Forced run requested via workflow_dispatch."
            exit 0
          fi
          # -print -quit (not `| head -n 1`): find stops at the first match on
          # its own, so it never gets SIGPIPE'd by head closing the pipe early
          # once the tree has more than one matching file - which, combined
          # with `set -e -o pipefail` above (from the bash shebang), used to
          # fail this whole step with exit 141 as soon as the repo grew past
          # a handful of sources.
          found=$(find modules src -type f \
                    \( -name '*.cpp' -o -name '*.cxx' -o -name '*.cc' \
                    -o -name '*.hpp' -o -name '*.hxx' -o -name '*.h' \) \
                    -print -quit 2>/dev/null)
          if [ -n "$found" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Sources detected (e.g. $found); running the full pipeline."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No C/C++ files under modules/ or src/ yet; skipping build, lint, sanitizers and coverage."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC",    os: ubuntu-latest,   cc: gcc }
          - { name: "Linux Clang",  os: ubuntu-latest,   cc: clang }
          - { name: "Windows MSVC", os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      # The key carries the run id so every run can save a fresh cache: a key that only
      # depends on vcpkg.json stays "hit" forever, is never re-saved, and goes stale when
      # the runner image changes the compiler (every package ABI hash changes with it).
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ matrix.cc || 'msvc' }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.cc || 'msvc' }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ matrix.cc || 'msvc' }}-

      - name: Select Clang
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang"   >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Set up (Linux)
        if: runner.os == 'Linux'
        run: bash ci/setup-linux.sh

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/setup-windows.ps1

      - name: Build & test
        shell: bash
        run: bash ci/build.sh dev

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  lint:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    name: Lint - clang-format + clang-tidy (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # clang-tidy's file list is split four ways, one runner each
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-tidy.sh diffs against the PR's base branch
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-Linux-lint-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-Linux-lint-${{ hashFiles('vcpkg.json') }}-
            vcpkg-Linux-lint-
            vcpkg-Linux-
      - run: bash ci/setup-linux.sh
      - name: clang-format
        if: matrix.shard == 0   # one check is enough, it does not depend on the shard
        run: bash ci/check-format.sh
      - name: clang-tidy (changed files on a PR, everything otherwise)
        env:
          MMS_TIDY_SHARD: ${{ matrix.shard }}/4
          MMS_TIDY_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bash ci/check-tidy.sh dev

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true' && matrix.shard == 0
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  sanitizers:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    name: Sanitizers - ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-Linux-asan-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-Linux-asan-${{ hashFiles('vcpkg.json') }}-
            vcpkg-Linux-asan-
            vcpkg-Linux-
      - run: bash ci/setup-linux.sh
      - run: bash ci/sanitize.sh asan

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  coverage:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-Linux-coverage-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-Linux-coverage-${{ hashFiles('vcpkg.json') }}-
            vcpkg-Linux-coverage-
            vcpkg-Linux-
      - run: bash ci/setup-linux.sh
      - run: bash ci/coverage.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.xml
            build/coverage/html
          if-no-files-found: ignore

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  docs:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    name: Docs - Doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-Linux-docs-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-Linux-docs-${{ hashFiles('vcpkg.json') }}-
            vcpkg-Linux-docs-
            vcpkg-Linux-
      - run: bash ci/setup-linux.sh
      - name: Build API docs
        run: |
          cmake --preset dev -DMMS_BUILD_DOCS=ON
          cmake --build --preset dev --target docs
      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build/dev/docs/html
          if-no-files-found: warn

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
